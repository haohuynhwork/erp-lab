# Dev services. The apps run on the host: `make dev:api`, `make dev:web`.
name: ${PROJECT_NAME:-erp-lab}

services:
  db:
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp}
      POSTGRES_DB: ${POSTGRES_DB:-erp}
    ports: ["127.0.0.1:${DB_PORT:-5432}:5432"]
    # Bind mount (not a named volume) so data lives with the repo, not on Docker's disk.
    volumes: [./.data/db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erp} -d ${POSTGRES_DB:-erp}"]
      interval: 5s
      retries: 10

  mqtt:
    image: eclipse-mosquitto:2
    command: mosquitto -c /mosquitto-no-auth.conf
    ports: ["127.0.0.1:${MQTT_PORT:-1883}:1883"]
